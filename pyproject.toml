    [build-system]
    requires = ["setuptools>=61.0"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "kariyer-ats-automation-api"
    version = "2.0.5"
    description = "Hardened FastAPI & Playwright automation backend for authenticated Kariyer.net ATS accounts"
    readme = "README.md"
    license = { text = "MIT" }
    requires-python = ">=3.10"
    authors = [
        { name = "Kariyer ATS API Team" }
    ]
    classifiers = [
        "Development Status :: 4 - Beta",
        "Framework :: FastAPI",
        "Framework :: Flask",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
        "Security :: Security Audit",
    ]

    dependencies = [
        "fastapi>=0.110.0",
        "flask>=3.0.0",
        "uvicorn>=0.28.0",
        "pydantic>=2.6.0",
        "pydantic-settings>=2.2.0",
        "python-dotenv>=1.0.1",
        "aiosqlite>=0.20.0",
        "playwright>=1.42.0",
        "requests~=2.32.3",
        "curl_cffi~=0.10.0",
        "pycryptodome~=3.21.0",
        "aiohttp>=3.9.0",
        "sentry-sdk[fastapi,flask]>=2.0.0",
        "opencv-python~=4.10.0.84",
        "numpy~=2.2.1",
        "ddddocr @ git+https://github.com/sml2h3/ddddocr.git@main#egg=ddddocr",
    ]

    [project.optional-dependencies]
    dev = [
        "pytest>=8.0.0",
        "pytest-asyncio>=0.23.0",
        "httpx>=0.27.0",
        "ruff>=0.4.0",
    ]

    [tool.setuptools.packages.find]
    where = ["."]
    include = ["app*"]

    [tool.pytest.ini_options]
    minversion = "8.0"
    testpaths = ["tests"]
    python_files = ["test_*.py"]
    asyncio_mode = "auto"
    filterwarnings = [
        "ignore::DeprecationWarning",
        "ignore::UserWarning",
    ]

    [tool.ruff]
    line-length = 100
    target-version = "py310"

    [tool.ruff.lint]
    select = ["E", "F", "I", "B", "S"]
    ignore = ["B008", "S101"]